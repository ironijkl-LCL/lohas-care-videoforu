<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<title>LohasVLG Camera FIX FINAL</title>

<style>
body{
    margin:0;
    background:black;
    overflow:hidden;
}

/* video */
video{
    position:fixed;
    width:100%;
    height:100%;
    object-fit:cover;
}

/* UI */
#startUI{
    position:fixed;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:black;
    color:white;
    z-index:10;
    font-size:1.5rem;
}

#btnStart{
    padding:20px;
    border-radius:20px;
    background:white;
    color:black;
}
</style>
</head>

<body>

<div id="startUI">
    <button id="btnStart">啟動相機</button>
</div>

<video id="video" playsinline muted></video>

<script>
const video = document.getElementById("video");

const app = {
    stream:null,
    facing:"user",
    zoom:1,

    async startCamera(){
        try{
            // 停掉舊 stream
            if(this.stream){
                this.stream.getTracks().forEach(t => t.stop());
            }

            let constraints = {
                video:{
                    facingMode: this.facing
                },
                audio:true
            };

            // ✅ iPhone fallback
            try {
                this.stream = await navigator.mediaDevices.getUserMedia(constraints);
            } catch(e) {
                this.stream = await navigator.mediaDevices.getUserMedia({
                    video:true,
                    audio:true
                });
            }

            video.srcObject = this.stream;

            // ✅ 必須 play()
            await video.play();

            this.applyTransform();

            console.log("✅ Camera 已啟動");
        }catch(err){
            alert("❌ 無法開啟相機: " + err.message);
        }
    },

    applyTransform(){
        const mirror = this.facing==="user" ? "scaleX(-1)" : "";
        video.style.transform = `${mirror} scale(${this.zoom})`;
    },

    async switchCamera(){
        this.facing = this.facing==="user" ? "environment" : "user";
        await this.startCamera();
    }
};

// ✅ 必須用按鈕觸發（iPhone必要）
document.getElementById("btnStart").onclick = async ()=>{
    document.getElementById("startUI").style.display="none";

    await app.startCamera();
};

/* ✅ 手勢：Zoom */
let lastY=0;
video.addEventListener("touchstart", e=>{
    lastY = e.touches[0].clientY;
});

video.addEventListener("touchmove", e=>{
    let y = e.touches[0].clientY;
    let delta = y - lastY;

    app.zoom += delta * 0.005;
    app.zoom = Math.max(1, Math.min(3, app.zoom));

    app.applyTransform();
    lastY = y;
});

/* ✅ 點擊切鏡頭（測試用） */
video.addEventListener("dblclick", ()=>{
    app.switchCamera();
});

</script>

</body>
</html>
