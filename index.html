<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<title>LohasVLG Pro - AI樂活日記</title>

<link rel="manifest" href="manifest.json">

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>

<style>
body {
    margin:0;
    font-family:sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#FF9A9E;
    transition: all 0.6s;
}

main{
    width:90%;
    max-width:400px;
    background:white;
    padding:25px;
    border-radius:30px;
    text-align:center;
}

#mascot{
    font-size:4rem;
    animation:bounce 1s infinite alternate;
}

@keyframes bounce {
    from {transform:translateY(0);}
    to {transform:translateY(-10px);}
}

video{
    width:100%;
    height:200px;
    border-radius:20px;
    background:black;
    margin:20px 0;
    object-fit:cover;
    transition:0.5s;
}

button{
    width:45%;
    padding:10px;
    border:none;
    border-radius:15px;
    margin:5px;
    font-weight:bold;
}

#ai{
    color:#555;
    margin:10px 0;
}
</style>
</head>

<body>

<main>
    <div id="mascot">🐢</div>
    <div id="msg">AI 樂活日記</div>

    <video id="video" autoplay muted playsinline></video>

    <div>
        <button onclick="app.trigger()">記錄</button>
        <button onclick="app.generate()">生成</button>
    </div>

    <div id="ai">✨ 今天會發生什麼美好呢？</div>

    <div>已蒐集：<span id="count">0</span>/3</div>
</main>

<audio id="bgm" loop></audio>

<script>
const { createFFmpeg, fetchFile } = FFmpeg;

const themes = [
    { bg:'#FF9A9E', icon:'🐢', msg:'慢活', filter:'sepia(.3)', music:'slow.mp3' },
    { bg:'#A1C4FD', icon:'🐬', msg:'自由', filter:'contrast(1.2)', music:'free.mp3' },
    { bg:'#FFF3B0', icon:'🌞', msg:'陽光', filter:'brightness(1.2)', music:'happy.mp3' },
    { bg:'#C7CEEA', icon:'🌙', msg:'夜晚', filter:'brightness(.7)', music:'night.mp3' }
];

// ✅ AI 模擬（如接 API 可替換）
function fakeAI(msg){
    const arr = [
        `今天的我，有點${msg}的味道`,
        `生活輕聲說：${msg}`,
        `我正在慢慢感受 ${msg}`,
        `這一刻，很 ${msg}`
    ];
    return arr[Math.floor(Math.random()*arr.length)];
}

const app = {
    stream:null,
    chunks:[],
    clips:[],
    count:0,

    async init(){
        this.stream = await navigator.mediaDevices.getUserMedia({video:true,audio:true});
        video.srcObject = this.stream;

        // ✅ PWA SW
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    },

    trigger(){
        if(this.count>=3) return alert("已滿");

        const t = themes[Math.floor(Math.random()*themes.length)];

        document.body.style.background = t.bg;
        mascot.innerText = t.icon;
        msg.innerText = t.msg;
        video.style.filter = t.filter;

        ai.innerText = fakeAI(t.msg);

        // 🎵 音樂
        bgm.src = t.music;
        bgm.play().catch(()=>{});

        this.record();
    },

    record(){
        this.chunks = [];

        const rec = new MediaRecorder(this.stream);
        rec.ondataavailable = e => this.chunks.push(e.data);

        rec.onstop = ()=>{
            this.clips.push(new Blob(this.chunks));
            this.count++;
            count.innerText = this.count;
        };

        rec.start();
        setTimeout(()=>rec.stop(),3000);
    },

    async generate(){
        if(this.count<3) return alert("請錄滿3段");

        const ffmpeg = createFFmpeg({ log:true });
        await ffmpeg.load();

        for(let i=0;i<this.clips.length;i++){
            ffmpeg.FS('writeFile', `v${i}.webm`, await fetchFile(this.clips[i]));
        }

        await ffmpeg.run(
            '-i','v0.webm','-i','v1.webm','-i','v2.webm',
            '-filter_complex',
            '[0:v][1:v][2:v]concat=n=3:v=1:a=0',
            'out.mp4'
        );

        const data = ffmpeg.FS('readFile','out.mp4');
        const url = URL.createObjectURL(new Blob([data.buffer],{type:'video/mp4'}));

        video.srcObject = null;
        video.src = url;
        video.controls = true;

        // ✅ 分享
        if(navigator.share){
            const file = new File([data.buffer],"lohas.mp4",{type:"video/mp4"});
            navigator.share({
                title:"我的樂活日記",
                files:[file]
            });
        }
    }
};

app.init();
</script>

</body>
</html>
