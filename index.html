<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<title>LohasVLG - AI樂活碎片</title>

<style>
:root { 
    --bg-base: #121212; 
    --accent-pink: #FF64C8; 
    --panel-bg: #1E1E1E;
    --sub-panel-bg: #252529;
    --card-bg: #111112; /* 截圖中的深色卡片背景 */
    --star-yellow: #FFEB3B;
}

body { 
    margin: 0;
    background: var(--bg-base);
    transition: background 0.8s ease;
    font-family: 'Segoe UI', -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: #fff;
}

/* 核心主容器 (100% 保留結構) */
#vlg-standalone-root { 
    width: 90%;
    max-width: 400px;
    background: var(--panel-bg);
    border-radius: 40px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    border: 1px solid rgba(255, 255, 255, 0.05);
    position: relative;
    overflow: hidden;
}

/* 📱 頂部導航欄 */
.lohas-top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}
.lohas-logo {
    font-size: 1.5rem;
    font-weight: bold;
    background: linear-gradient(45deg, #7BE4FF, #A1C4FD);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.lohas-nav-icons {
    display: flex;
    gap: 10px;
    position: relative;
}
.nav-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #2D2D2D;
    border: none;
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* 🌟 新增：vlog 資訊卡片樣式 */
.vlog-info-card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 18px;
    text-align: left;
    position: relative;
    margin-bottom: 12px;
    border: 1px solid rgba(255, 255, 255, 0.03);
}
.vlog-card-title {
    font-size: 1.1rem;
    font-weight: bold;
    margin-bottom: 6px;
    display: block;
}
.vlog-card-desc {
    font-size: 0.85rem;
    color: #8E8E93;
    line-height: 1.4;
    max-width: 80%;
}
/* 右側特色黃色星星氣泡圖標 */
.star-bubble-icon {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    background: var(--star-yellow);
    color: #000;
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 1.2rem;
    box-shadow: 0 4px 10px rgba(255, 235, 59, 0.3);
}

/* 🌟 新增：Share with eat 互動工具列樣式 */
.share-eat-toolbar {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 12px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    border: 1px solid rgba(255, 255, 255, 0.03);
}
.share-text {
    font-size: 1.1rem;
    font-weight: 500;
}
.share-tools-group {
    display: flex;
    gap: 12px;
}
.tool-btn {
    background: #1C1C1E;
    border: none;
    color: #8E8E93;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    font-size: 1rem;
}

/* 🔔 提醒小黃點 */
.noti-badge {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 8px;
    height: 8px;
    background: #FFD43F;
    border-radius: 50%;
    display: none;
}

/* ✨ Mascot 區塊 */
.mascot-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,0.04);
    padding: 12px 18px;
    border-radius: 20px;
    margin-bottom: 15px;
    text-align: left;
}
.mascot-left-group { display: flex; align-items: center; }
#mascot-display { font-size: 2.2rem; animation: bounce 1s infinite alternate; margin-right: 15px; cursor: pointer; }
#mascot-right-btn { font-size: 2.2rem; animation: bounce 1s infinite alternate-reverse; cursor: pointer; padding-left: 10px; }
#vlg-status-text { font-size: 1rem; font-weight: bold; color: #fff; }

@keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-6px); } }

/* 🎬 相機預覽區域 */
.camera-preview-wrapper { position: relative; width: 100%; margin-bottom: 15px; }
.camera-status-tag { position: absolute; top: 15px; left: 15px; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(6px); padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; color: #fff; z-index: 10; pointer-events: none; display: flex; align-items: center; gap: 6px; }
.status-dot { width: 6px; height: 6px; background: #FF3B30; border-radius: 50%; display: inline-block; }

#vlg-video-player {
    width: 100%;
    height: 240px;
    border-radius: 30px;
    object-fit: cover;
    border: 4px solid var(--accent-pink);
    box-shadow: 0 0 20px rgba(255, 100, 200, 0.25);
    background: #000;
}

/* 切換模式選單融入預覽區底部 */
.camera-mode-selectors {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    justify-content: center;
    gap: 12px;
    font-size: 0.85rem;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(8px);
    padding: 4px 6px;
    border-radius: 16px;
    width: max-content;
}
.mode-opt { cursor: pointer; padding: 4px 14px; border-radius: 12px; transition: all 0.2s; color: rgba(255,255,255,0.6); }
.mode-opt.active { color: #fff; background: var(--accent-pink); font-weight: bold; }

#ai-text { margin: 15px 0; font-size: 0.9rem; color: #B3B3B3; background: rgba(255,255,255,0.03); padding: 15px; border-radius: 20px; border-left: 4px solid var(--accent-pink); text-align: left; }

.counter-box { margin-top: 15px; font-size: 0.85rem; color: #888; }
#vlg-count { font-weight: bold; color: #fff; }

.vlg-controls { display: flex; gap: 12px; margin-top: 20px; }
button { flex: 1; padding: 16px; border: none; border-radius: 25px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: all 0.3s; }
#vlg-start-btn { background: #fff; color: #000; }
#vlg-generate-btn { background: #2D2D2D; color: #fff; }

/* 其他附表、遮罩樣式 (維持不變) */
.lohas-popover { position: absolute; background: rgba(32, 32, 38, 0.95); backdrop-filter: blur(14px); border-radius: 28px; padding: 6px; width: 210px; z-index: 100; display: none; text-align: left; }
.lohas-full-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #000; z-index: 150; border-radius: 40px; padding: 25px; display: none; flex-direction: column; text-align: left; }

/* 📱 響應式網頁設計 */
@media (max-width: 500px) {
    body { padding: 0; background: var(--panel-bg); }
    #vlg-standalone-root { width: 100%; max-width: 100%; min-height: 100vh; border-radius: 0; border: none; }
}
</style>
</head>

<body>

<main id="vlg-standalone-root">
    <div class="lohas-top-bar">
        <div class="lohas-logo">SETLOG</div>
        <div class="lohas-nav-icons">
            <button class="nav-btn" id="lohas-plus-btn">+</button>
            <button class="nav-btn" id="lohas-bell-btn">🔔<span class="noti-badge" id="lohas-bell-badge"></span></button>
            <button class="nav-btn" id="lohas-more-btn">•••</button>
        </div>
    </div>

    <div class="mascot-container">
        <div class="mascot-left-group">
            <div id="mascot-display">🐢</div>
            <div id="vlg-status-text">LohasVLG手記</div>
        </div>
        <div id="mascot-right-btn">🐢</div>
    </div>

    <div class="camera-preview-wrapper">
        <div class="camera-status-tag">
            <span class="status-dot"></span>
            <span>📷 轉橫向更生鬼</span>
        </div>
        <video id="vlg-video-player" autoplay playsinline muted></video>
        <div class="camera-mode-selectors">
            <div class="mode-opt active" id="mode-photo" onclick="App.switchCameraMode('photo')">拍攝照片</div>
            <div class="mode-opt" id="mode-video" onclick="App.switchCameraMode('video')">錄製影片</div>
        </div>
    </div>

    <div class="vlog-info-card" onclick="alert('進入 vlog 專屬空間設定')">
        <span class="vlog-card-title">vlog</span>
        <p class="vlog-card-desc">這是你的專屬空間，每一天從凌晨 4 點到隔天凌晨 4 點。</p>
        <div class="star-bubble-icon">⭐</div>
    </div>

    <div class="share-eat-toolbar">
        <span class="share-text">Share with eat</span>
        <div class="share-tools-group">
            <button class="tool-btn" title="使用者頭像導引" onclick="alert('切換分享對象')">👤</button>
            <button class="tool-btn" title="即時相機快捷鍵" onclick="App.trigger()">📷</button>
        </div>
    </div>

    <div id="ai-text">✨ 點擊「記錄閃光」捕捉今日生活；集滿 3 段解鎖「生成日記」！</div>

    <div class="vlg-controls">
        <button id="vlg-start-btn">記錄閃光</button>
        <button id="vlg-generate-btn">生成日記</button>
    </div>

    <div class="counter-box">
        已蒐集樂活晶片：<span id="vlg-count">0</span> / 3
    </div>

    <div class="lohas-full-overlay" id="overlay-view-log"></div>
    <div class="lohas-full-overlay" id="overlay-landscape-camera"></div>
    <div class="lohas-modal-overlay" id="name-modal-overlay"></div>
    <div class="photo-preview-overlay" id="photo-preview-box"></div>
</main>

<canvas id="photo-capture-canvas" style="display:none;" width="640" height="480"></canvas>

<script>
// 主題陣列
const themes = [
    { bg:'#FF9A9E', icon:'🐢', msg:'慢慢走也很好', filter:'sepia(0.3)' },
    { bg:'#A1C4FD', icon:'🐬', msg:'跳進自由感', filter:'contrast(1.2)' },
    { bg:'#FFD1FF', icon:'🦄', msg:'夢幻一下', filter:'brightness(1.2)' }
];

let currentIcon = '🐢';

const App = {
    count: 0,
    stream: null,
    cameraMode: 'photo',

    async init() {
        try {
            this.stream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
            document.getElementById("vlg-video-player").srcObject = this.stream;
        } catch(e) { console.log("相機權限受限。"); }
        this.initButtons();
    },

    initButtons() {
        document.getElementById('vlg-start-btn').onclick = () => this.trigger();
        document.getElementById('vlg-generate-btn').onclick = () => alert('生成日記中...');
        // 公仔鍵連動
        document.getElementById('mascot-right-btn').onclick = () => this.trigger();
    },

    switchCameraMode(mode) {
        this.cameraMode = mode;
        document.getElementById('mode-photo').classList.toggle('active', mode === 'photo');
        document.getElementById('mode-video').classList.toggle('active', mode === 'video');
    },

    trigger() {
        if(this.count >= 3) return alert("已滿片段");
        const t = themes[Math.floor(Math.random()*themes.length)];
        document.body.style.background = t.bg;
        document.getElementById("mascot-display").innerText = t.icon;
        document.getElementById("mascot-right-btn").innerText = t.icon;
        this.count++;
        document.getElementById("vlg-count").innerText = this.count;
        alert(`已捕獲第 ${this.count} 段樂活晶片！`);
    }
};

App.init();
</script>

</body>
</html>
